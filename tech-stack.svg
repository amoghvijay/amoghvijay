<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #1a1a1a; stroke-width: 2.5; }
      .label { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 20px; fill: #111111; }
      .dash { stroke: #111111; stroke-width: 2; stroke-dasharray: 6,6; fill: none; }
      .term-text { font-family: 'Fira Code', monospace; font-size: 16px; }
    </style>
  </defs>

  <rect x="30" y="20" width="940" height="520" rx="28" fill="#F4CF52"/>

  <!-- Left speaker decor -->
  <rect x="90" y="90" width="80" height="130" rx="6" class="box"/>
  <circle cx="130" cy="130" r="24" fill="none" stroke="#111" stroke-width="2.5"/>
  <circle cx="130" cy="130" r="9" fill="#111"/>
  <circle cx="130" cy="185" r="18" fill="none" stroke="#111" stroke-width="2.5"/>
  <circle cx="130" cy="185" r="7" fill="#111"/>

  <!-- Right speaker decor -->
  <rect x="830" y="90" width="80" height="130" rx="6" class="box"/>
  <circle cx="870" cy="130" r="24" fill="none" stroke="#111" stroke-width="2.5"/>
  <circle cx="870" cy="130" r="9" fill="#111"/>
  <circle cx="870" cy="185" r="18" fill="none" stroke="#111" stroke-width="2.5"/>
  <circle cx="870" cy="185" r="7" fill="#111"/>

  <!-- LLMs -->
  <rect x="235" y="100" width="150" height="60" rx="10" class="box"/>
  <text x="310" y="137" text-anchor="middle" class="label">LLMs</text>

  <!-- AGENTS -->
  <rect x="615" y="100" width="150" height="60" rx="10" class="box"/>
  <text x="690" y="137" text-anchor="middle" class="label">AGENTS</text>

  <!-- BACKEND -->
  <rect x="200" y="220" width="160" height="60" rx="10" class="box"/>
  <text x="280" y="257" text-anchor="middle" class="label">BACKEND</text>

  <!-- FRONTEND -->
  <rect x="640" y="220" width="160" height="60" rx="10" class="box"/>
  <text x="720" y="257" text-anchor="middle" class="label">FRONTEND</text>

  <!-- MEMORY -->
  <rect x="215" y="330" width="150" height="60" rx="10" class="box"/>
  <text x="290" y="367" text-anchor="middle" class="label">MEMORY</text>

  <!-- CLOUDS -->
  <rect x="630" y="330" width="150" height="60" rx="10" class="box"/>
  <text x="705" y="367" text-anchor="middle" class="label">CLOUDS</text>

  <!-- Center terminal -->
  <rect x="380" y="195" width="240" height="105" rx="10" fill="#0d1117" stroke="#111" stroke-width="2.5"/>
  <text x="400" y="225" class="term-text" fill="#4ade80">&gt; amogh.run()</text>
  <text x="400" y="250" class="term-text" fill="#a78bfa">AGENTS: ACTIVE</text>
  <text x="400" y="275" class="term-text" fill="#4ade80">SYS: 99.9% OK</text>

  <!-- small camera/eye icon above terminal -->
  <rect x="480" y="150" width="40" height="30" rx="6" class="box"/>
  <circle cx="500" cy="165" r="7" fill="#111"/>

  <!-- Stand -->
  <path d="M 440 300 L 500 340 L 560 300" class="dash"/>
  <line x1="500" y1="320" x2="470" y2="360" stroke="#111" stroke-width="2.5"/>
  <line x1="500" y1="320" x2="530" y2="360" stroke="#111" stroke-width="2.5"/>

  <!-- Dashed connectors -->
  <path d="M 385 130 L 480 165" class="dash"/>
  <path d="M 615 130 L 520 165" class="dash"/>
  <path d="M 360 250 L 480 240" class="dash"/>
  <path d="M 640 250 L 520 240" class="dash"/>
  <path d="M 365 360 L 460 300" class="dash"/>
  <path d="M 630 360 L 540 300" class="dash"/>
</svg>
